name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - name: Locate static output
        run: |
          DIR=$(dirname "$(find dist -name index.html -path '*client*' | head -n1)")
          [ -z "$DIR" ] || [ "$DIR" = "." ] && DIR=$(dirname "$(find dist -name index.html | head -n1)")
          echo "Static dir: $DIR"
          cp "$DIR/index.html" "$DIR/404.html"
          touch "$DIR/.nojekyll"
          echo "STATIC_DIR=$DIR" >> "$GITHUB_ENV"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.STATIC_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
